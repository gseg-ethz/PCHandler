name: GPU Tests

# The GPU test job (CI-15, Phase 13 D-11), relocated verbatim out of `ci.yml` so
# that a lab outage blocks a release LEGIBLY — as one named required context that
# goes red — instead of silently passing a gate the job never ran on.
#
# ===================== THE SAME-COMMIT PAIR — READ THIS FIRST ================
# `pull_request:` below and `environment: gpu-lab` on the job below are ONE atom
# and must NEVER be separated, in either direction, in any commit.
#
# THIS REPOSITORY IS PUBLIC and this job runs on self-hosted lab hardware. The
# trigger WITHOUT the environment puts that hardware within reach of any
# stranger's fork pull request — the exact configuration GitHub's own
# documentation tells you not to build. The `gpu-lab` environment (created
# 2026-07-30, id 19002352745) carries required reviewers with administrator
# bypass DESELECTED and self-review PREVENTED, so a lab run always costs a click
# from a human who is not the pull request's author. Layer two is independent and
# repository-level: "Require approval for all external contributors", which stops
# a fork-originated run starting at all and also covers the hosted-runner jobs
# the environment does not touch.
# Cite: Phase 13 D-11, DESIGN-DECISIONS entry 39. Recorded 2026-07-30 (13-08).
# =============================================================================
#
# What else MUST stay true, and why:
#
#   - `Tests (pytest, GPU)` below IS a ruleset required-status-check context
#     string (`.github/rulesets/main.json`), on the protected branch ONLY.
#     RENAMING this job is a coordinated change across BOTH committed payloads —
#     `main.json` and the lab-outage override `main.no-gpu.json` — in ONE commit,
#     or the protected branch requires a context nothing produces and becomes
#     unmergeable BY ANYONE under `bypass_actors: []` (CI-10, DESIGN-DECISIONS
#     entry 37).
#   - NO job-level `if:` and NO dependency edge on this job. GitHub counts a
#     `skipped` conclusion among the SATISFYING ones, so either shape greens the
#     gate having executed nothing (assertions A5 and A6 in
#     `.github/scripts/check_ci_config.py`). Conditionality belongs on STEPS. The
#     event-name `if:` this job carried while it lived in `ci.yml` is superseded
#     by the environment, which is a real gate rather than a skip.
#   - `branches: [main]` under `pull_request:` is INTENDED SCOPE, not drift: the
#     context is required on the protected branch only, so no excluded branch is
#     ever left waiting on a check that never reports. That is why this file is
#     the one reviewed exception in assertion A1's table, with the reason stated
#     there rather than the rule weakened.
#   - The base-repo-context sibling of `pull_request:` must never appear in this
#     file. It runs with THIS repository's secrets against a fork's code, and
#     this is the workflow with the lab runner attached. Assertion A2 fails the
#     build on that token anywhere under this directory.
#   - The image is DIGEST-pinned in `.github/digests/gpu-runner.txt`, NOT in this
#     file, and `gpu-image-refresh.yml` rewrites THAT artefact BY PATH. The pin
#     moved out of `.github/workflows/**` at plan 17-05 because a GitHub App
#     installation token structurally cannot write that prefix, which is what has
#     kept the write-back broken since 2026-07-01 (D-17-15; DESIGN-DECISIONS
#     entry 45). The rename hazard transfers with it: if THAT file is ever renamed
#     or moved, retarget every anchor in the refresh workflow in the SAME commit —
#     its `sed` exits 0 on zero matches, so a stale target yields an empty-diff
#     pull request rather than a red run, which is why it greps the written digest
#     back out. This job resolves the pin at job start and FAILS CLOSED; there is
#     no fallback to a moving tag under any condition. (That workflow is itself
#     still QUARANTINED as of 2026-07-30 — see its header; its write-back is now
#     unblocked by the relocation, but its monthly cron stays off BY DECISION.
#     The pin is a digest, not a moving tag, so a paused refresh is a staleness
#     cost, not a breakage.)

on:
  # SAME-COMMIT PAIR with `environment: gpu-lab` below — see the header block.
  pull_request:
    branches: [main]
  push:
    # Post-merge lab heartbeat. DESIGN-DECISIONS entry 35 retired `ci.yml`'s
    # push-to-protected-branch run as a pure duplicate of the pull-request run;
    # it is kept HERE deliberately because this job's failures are overwhelmingly
    # HOST state (driver bump, stale CDI spec, image rot) rather than repository
    # content, and unlike `ci.yml` this workflow carries no nightly schedule of
    # its own that would otherwise notice.
    branches: [main]
  workflow_dispatch:

jobs:
  gpu-tests:
    name: Tests (pytest, GPU)
    # SAME-COMMIT PAIR with the `pull_request:` trigger above — see the header.
    # D-11 layer 1. An environment's protection rules are evaluated BEFORE the
    # job is dispatched to a runner, so a waiting job holds the required check
    # `pending` with NO runner assigned, and nothing from the pull request's head
    # ref executes on lab hardware until a human clicks approve.
    environment: gpu-lab
    runs-on: [self-hosted, linux, x64, gpu, cuda12, pchandler-cuda12]
    permissions:
      contents: read
      packages: read        # pull the private GHCR image via podman login
      pull-requests: read   # the `classify` step below reads the PR file list (CI-11 D-05/D-07)
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      # CI-11's release-artifact fast path, wired exactly as the `tests` job in
      # `ci.yml` wires it. MUST follow the checkout: a local composite is
      # resolved from the runner filesystem, so it does not exist until the
      # repository is on disk.
      #
      # COST THIS DOES NOT BUY, recorded rather than discovered later: the
      # environment gates the job BEFORE it reaches a runner, so a
      # release-artifact-only pull request still costs one human approval click
      # even though every step below then skips. That is an accepted cost of
      # putting the gate where it is safe rather than where it is cheap.
      #
      # FAIL-SAFE ON THIS RUNNER, which is why the fast path is safe to wire onto
      # a self-hosted job at all: the composite reads the changed-path list
      # through `gh api`. If the API client (or any tooling it needs) is absent
      # on the self-hosted host, that call fails and the composite emits the
      # run-everything value — the correct direction. Every other unknown
      # (non-pull-request event, empty list, truncated list, unrecognised path)
      # resolves the same way.
      - id: classify
        uses: ./.github/actions/classify-changes

      # WHERE THE IMAGE COMES FROM, and why it is a file rather than a pin in this
      # workflow. Until plan 17-05 the digest sat in a job-level `env:` block here and
      # `gpu-image-refresh.yml` rewrote it in place. GitHub refuses ANY GitHub App push
      # touching `.github/workflows/**` unless the App holds `workflows: write` — a
      # permission with NO key in a workflow's `permissions:` block, so no edit to a
      # workflow can grant it — and that is why the monthly write-back has been rejected
      # since 2026-07-01 (run 28513581287). Moving the pin to a versioned artefact
      # OUTSIDE that prefix unblocks the write-back with no new credential and no new
      # automation: D-17-15, which is option (b) of the refresh workflow's own header,
      # and DESIGN-DECISIONS entry 45 for why widening the token is a decision, not a fix.
      #
      # STILL NOT a `container:` block — the reason moved here with the pin it explained.
      # GitHub's `container:` jobs hardcode `-v /var/run/docker.sock`, which a rootless-
      # Podman host has no way to provide (root-owned /var/run), so we launch the image
      # ourselves with `podman run` (09-02 commissioning 2026-06-15 — CONTEXT D-02
      # container mechanism amended from GitHub-native `container:` to explicit
      # `podman run`). That is why the resolved reference is exported through
      # `$GITHUB_ENV` for the steps below rather than consumed by a `container.image:`
      # field GitHub would resolve itself.
      #
      # FAILS CLOSED, without exception. A missing, empty, multi-line or malformed pin
      # exits 1 with a named error. There is NO fallback to a moving tag under ANY
      # condition: a moving tag behind a required context is precisely the silent-
      # substitution class this phase exists to close (T-17-18, T-17-19). Assertion A9
      # in `.github/scripts/check_ci_config.py` fails the build if this shape is broken
      # or if a concrete digest is inlined back into this job.
      - name: Resolve the pinned GPU image digest
        if: steps.classify.outputs.release-artifacts-only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PIN_FILE=.github/digests/gpu-runner.txt
          PIN_REPO=ghcr.io/gseg-ethz/pchandler-gpu-runner
          if [ ! -f "$PIN_FILE" ]; then
            echo "::error::${PIN_FILE} is missing, so the GPU runner image is unresolvable. Refusing to fall back to a moving tag — an unpinned image behind a required context is a silent substitution (D-17-15)."
            exit 1
          fi
          PIN_LINES=$(grep -cve '^[[:space:]]*$' "$PIN_FILE" || true)
          if [ "$PIN_LINES" != "1" ]; then
            echo "::error::${PIN_FILE} must hold EXACTLY ONE non-empty line; it holds ${PIN_LINES}. gpu-image-refresh.yml rewrites this file with sed and greps the digest back out, and both assume a single-line artefact."
            exit 1
          fi
          PIN=$(grep -ve '^[[:space:]]*$' "$PIN_FILE" | tr -d '[:space:]')
          if ! printf '%s' "$PIN" | grep -qE "^${PIN_REPO}@sha256:[0-9a-f]{64}\$"; then
            echo "::error::${PIN_FILE} does not hold a full-length pinned reference. Expected ${PIN_REPO}@sha256: followed by 64 lowercase hex characters; read: '${PIN}'. A short, truncated or tag-shaped value is refused rather than resolved."
            exit 1
          fi
          echo "GPU_IMAGE=${PIN}" >> "$GITHUB_ENV"
          echo "resolved GPU image from ${PIN_FILE}: ${PIN}"

      - name: GHCR login (podman)
        if: steps.classify.outputs.release-artifacts-only != 'true'
        shell: bash
        # T-13-41, ACCEPTED with the visibility MEASURED 2026-07-30: the
        # `pchandler-gpu-runner` package is `private`, so on an APPROVED external
        # fork pull request this login fails with the fork author's read-scoped
        # token and the required check goes red on a legitimate contribution.
        # That is a support burden, not a security hole — the environment gate
        # holds either way — and the sanctioned remedies (publish the package, or
        # hand the job a registry credential) are both larger decisions than this
        # phase carries.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pre-flight GPU health check
        if: steps.classify.outputs.release-artifacts-only != 'true'
        shell: bash
        # Fail fast with a readable message if the runner GPU / CDI injection is in a bad state,
        # instead of an opaque SIGSEGV deep in the test run. Diagnosed 2026-06-18 (debug session
        # gpu-cuspatial-segfault): the historical SC2 segfault was non-reproducible across ~1149 runs
        # and is best explained by a transient host-driver vs CDI-injected-libcuda mismatch during a
        # run that straddled a driver bump / CDI regeneration. This guard turns a recurrence into a
        # clear error naming the fix (regenerate the CDI spec).
        run: |
          HOST_DRV=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1 | tr -d '[:space:]')
          echo "host driver: $HOST_DRV"
          podman run --rm --user 0 --device nvidia.com/gpu=all \
            -e NUMBA_CUDA_USE_NVIDIA_BINDING=1 -e HOST_DRV="$HOST_DRV" \
            "$GPU_IMAGE" \
            bash -lc '
              set -euo pipefail
              CON_DRV=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1 | tr -d "[:space:]")
              echo "container driver: $CON_DRV"
              if [ "$CON_DRV" != "$HOST_DRV" ]; then
                echo "::error::GPU driver mismatch host=$HOST_DRV container=$CON_DRV — stale CDI injection. Fix on the runner: sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml"
                exit 1
              fi
              python -c "import cudf, cuspatial, geopandas as gpd; from shapely.geometry import Polygon; pg = cuspatial.GeoSeries(gpd.GeoSeries([Polygon([[0,0],[10,0],[10,5],[0,5]])])); pts = cuspatial.GeoSeries.from_points_xy(cudf.DataFrame({\"x\": [1.0, 9.0], \"y\": [1.0, 9.0]}).interleave_columns()); assert cuspatial.point_in_polygon(pts, pg)[0].to_numpy().tolist() == [True, False]; print(\"cuspatial smoke OK\")"
            '
      - name: Run GPU tests in the RAPIDS container (podman)
        if: steps.classify.outputs.release-artifacts-only != 'true'
        shell: bash
        # --user 0: rootless Podman has no /etc/subuid range, so the image's non-root 'rapids'
        #   (UID 1001) user can't be mapped — container-root maps to the unprivileged host user.
        # --device nvidia.com/gpu=all: CDI GPU passthrough (D-03a).
        # Source bind-mounted at /work; coverage written there so the host codecov step sees it.
        # GSEGUtils now installs from PyPI (D-10 dep swap, Phase 11-06) — no git+ssh / SSH agent
        #   needed in the container. The base provides the conda GPU stack (cudf/cuspatial/
        #   geopandas); `.[dev]` only — [cuda12] PyPI wheels would conflict.
        # NUMBA_CUDA_USE_NVIDIA_BINDING=1: numba.cuda's legacy ctypes driver wrapper segfaults at
        #   as_cuda_array on the host's CUDA 13.2 driver (cuspatial.point_in_polygon -> numba_cuda);
        #   the official cuda-python bindings fix it. Verified on gseg-pc105 2026-06-15 (09-02).
        # Retry-on-139: the SC2 segfault was diagnosed non-reproducible (debug session
        #   gpu-cuspatial-segfault, 2026-06-18) — a transient GPU/driver-injection fault. We retry the
        #   test step ONLY on exit 139 (SIGSEGV), up to MAX_ATTEMPTS. Real test failures exit 1, not
        #   139, so this cannot mask a genuine regression.
        run: |
          podman run --rm \
            --user 0 \
            --device nvidia.com/gpu=all \
            -v "$PWD":/work -w /work \
            -e NUMBA_CUDA_USE_NVIDIA_BINDING=1 \
            "$GPU_IMAGE" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              nvidia-smi
              # The container's numpy is held inside the corridor by
              # .github/constraints/gpu.txt -- a versioned, diffable, assertable file
              # rather than an inline pin (D-17-10, D-17-14). This is the ONLY seam
              # where it is decided: the install just below is `.[dev]`, so neither the
              # GPU extras' ceiling nor conda's numba constrains this resolve, and pip
              # does not take already-installed packages into account. Assertion A9 in
              # .github/scripts/check_ci_config.py fails the build if the `-c` is
              # dropped or the constraints file goes missing.
              pip install -c .github/constraints/gpu.txt -e .[dev]
              # POST-INSTALL GPU CAPABILITY ASSERT (CI-17, D-17-05). This is a relocation of a
              # proven pattern, not a new mechanism: the Pre-flight GPU health check step above
              # asserts the same capability, and on 2026-08-17 it passed. Read the four
              # timestamps in that run log in order — 12:33:31 cuspatial smoke OK, 12:33:47
              # uninstalling numpy-2.0.2, 12:33:54 installed numpy-2.3.5, 12:33:57 three
              # skipped and exit 0. The assertion was never missing; it ran before the step
              # that invalidated it, and a required context then reported green having executed
              # nothing. So a second copy has to sit HERE, inside the same container run, after
              # the dependency step above and before the suite below.
              # No bypass token and no error tolerance is added here (D-17-04): the only
              # sanctioned escape for a degraded lab is the committed main.no-gpu.json ruleset
              # variant, deployed through the ruleset-apply dispatch with a recorded reason.
              # Assertion A8 in .github/scripts/check_ci_config.py fails the build if this block
              # is removed, moved before the dependency step, inverted, or neutered.
              python -c "if 1:
                  import sys
                  import pchandler._optional as opt
                  if not opt.is_gpu_available():
                      why = repr(opt._GPU_ERROR) if opt._GPU_ERROR is not None else \"the spec-only probe found one of cudf, cuspatial or geopandas absent from this container\"
                      print(\"::error::GPU capability was lost by this runs own dependency install. pchandler.filters.gpu is inert, so the GPU suite below would skip every test and exit 0 behind a green required context (CI-17, D-17-05). Reason: \" + why)
                      sys.exit(1)
                  print(\"post-install GPU capability assert: is_gpu_available() is True\")
                  "
              # VRAM as the suite starts. Diagnostic only — it gates nothing and asserts
              # nothing (DESIGN-DECISIONS 89, ROADMAP two-residuals, deferred to v1.3). The
              # nvidia-smi earlier in this body runs before the dependency step and is too
              # early to characterise the state the suite actually meets. The retry loop below
              # retries exit 139 only, so a co-tenant CUDA OOM exits 1 unretried with no record
              # of why; this line is that record. Deliberately no threshold and no exit.
              nvidia-smi --query-gpu=memory.total,memory.used,memory.free --format=csv
              MAX_ATTEMPTS=2
              attempt=1
              while :; do
                set +e
                pytest tests/filters/test_gpu.py -v --cov=pchandler.filters.gpu --cov-report=xml:/work/coverage-gpu.xml
                ec=$?
                set -e
                [ $ec -eq 0 ] && break
                if [ $ec -eq 139 ] && [ $attempt -lt $MAX_ATTEMPTS ]; then
                  echo "::warning::gpu-tests exit 139 (transient GPU SIGSEGV) on attempt $attempt/$MAX_ATTEMPTS — retrying. Diagnosed non-reproducible 2026-06-18 (debug session gpu-cuspatial-segfault)."
                  attempt=$((attempt + 1))
                  continue
                fi
                exit $ec
              done
            '
      - name: Upload GPU coverage
        if: success() && steps.classify.outputs.release-artifacts-only != 'true'
        uses: codecov/codecov-action@8cad3ba95e5920c42f44492e54bc9639cba47959  # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-gpu.xml
          flags: gpu
